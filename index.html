<style>
    /* Essential pre-load styles */
    .pre-splash {
      position: fixed;
      inset: 0;
      background: #07060B;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .pre-glitch-wrapper {
      position: relative;
      width: 90vw;
      max-width: 600px;
      height: 30vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pre-glitch-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body style="background-color: #07060B; color: #ffffff; margin: 0; padding: 0;">
  <div id="root">
    <div class="pre-splash">
      <div class="pre-glitch-wrapper">
        <img src="/assets/logo-dark.webp" alt="Loading..." class="pre-glitch-img" decoding="async" />
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
